<!-- SweetAlert2 CDN ထည့်သွင်းခြင်း -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // Delete အတွက် Confirmation တောင်းမည့် JS Function
    window.showDeleteConfirm = function (message) {
        return Swal.fire({
            title: 'Are you sure?',
            text: message,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            return result.isConfirmed; // True သို့မဟုတ် False ပြန်ပို့ပေးမည်
        });
    }

    // အောင်မြင်ကြောင်း Toast Notification ပြသမည့် JS Function
    window.showToast = function (message, icon) {
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });
        Toast.fire({ icon: icon, title: message });
    }
</script>
